# Swipes the front page from top to bottom like a thumb (recorded as scroll.mp4). Each round swipes once
# low on the screen, then once high: in run 1 the low swipe alone stuck for good on the workers map.
appId: com.apple.mobilesafari
---
- openLink: ${BASE}/?r=s1#front
- extendedWaitUntil:
    visible: "Get the app"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s01-top
- repeat:
    times: 40
    while:
      notVisible: "Terms of Service"
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 45%
          duration: 400
      - swipe:
          start: 50%, 35%
          end: 50%, 8%
          duration: 400
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s02-end
