# Swipes the front page from top to bottom like a thumb (recorded as scroll.mp4). Each round swipes once
# mid-screen like a thumb, then once along the left edge: runs 1 and 2 stuck for good on the workers map
# (it covers the middle of the screen and does not pass a vertical swipe to the page).
appId: com.apple.mobilesafari
---
- openLink: ${BASE}/?r=s1#front
- extendedWaitUntil:
    visible: "Get the app"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s01-top
- repeat:
    times: 40
    while:
      notVisible: "Terms of Service"
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 45%
          duration: 400
      - swipe:
          start: 7%, 78%
          end: 7%, 40%
          duration: 400
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s02-end
