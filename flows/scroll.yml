# Swipes the front page from top to bottom like a thumb (recorded as scroll.mp4), mid-screen only: short slow swipes
# (about 200 px of page each, less than either map is tall), so swipes start on both maps; a map that kept a vertical
# swipe would hold the page for good (runs 1 and 2 stuck on the workers map before its touch-action fix). The last
# step is a hard check: the footer's "Terms of Service" is on screen, so the page got past both maps to its end.
appId: com.apple.mobilesafari
---
- openLink: ${BASE}/?r=s1#front
- extendedWaitUntil:
    visible: "Get the app"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s01-top
- repeat:
    times: 100
    while:
      notVisible: "Terms of Service"
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 55%
          duration: 1000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s02-end
- assertVisible: "Terms of Service"
