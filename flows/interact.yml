# The front page in Safari with a screenshot after each step (recorded as interact.mp4): it loads, "Get the app" goes
# to its section, swipes reach the page end, then the FAQ: the "+" of "When am I charged?" opens it, the "+" of
# "Who can see my address?" (mid-list) opens it too, and the first one's button closes it again. Each tap lands on the
# round "+" button: 93% across the question's button, half way down (point within the element, Maestro 2.0.4 and later).
# The middle steps are optional, so one miss does not hide the steps after it (the screenshots show what happened);
# the last two checks are hard, so a wrong end state fails the run.
appId: com.apple.mobilesafari
---
- openLink: ${BASE}/?r=i1#front
- extendedWaitUntil:
    visible: "Get the app"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i01-front
- tapOn:
    text: "Get the app"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i02-get-the-app
- repeat:
    times: 40
    while:
      notVisible: "Terms of Service"
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 45%
          duration: 400
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i03-faq-closed
- tapOn:
    text: 'When am I charged\?'
    index: 0
    point: "93%,50%"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i04-faq-first-open
- assertVisible:
    text: 'When you accept a bid.*'
    optional: true
- tapOn:
    text: 'Who can see my address\?'
    index: 0
    point: "93%,50%"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i05-faq-mid-list-open
- assertVisible:
    text: 'Only the worker you hire.*'
    optional: true
- tapOn:
    text: 'When am I charged\?'
    index: 0
    point: "93%,50%"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i06-faq-first-closed
- assertVisible: 'Only the worker you hire.*'
- assertNotVisible: 'When you accept a bid.*'
